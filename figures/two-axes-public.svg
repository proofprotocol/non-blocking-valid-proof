<svg xmlns="http://www.w3.org/2000/svg" width="680" height="440" viewBox="0 0 680 440" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>The two axes of a valid proof</title>
<style>
.th{font:500 15px Arial,Helvetica,sans-serif;fill:#e8e6df}
.t{font:14px Arial,Helvetica,sans-serif;fill:#c2c0b6}
.ts{font:12px Arial,Helvetica,sans-serif;fill:#a9a79f}
.big{font:600 16px Arial,Helvetica,sans-serif;fill:#e8e6df}
</style>
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#9c9a92" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="680" height="440" rx="14" fill="#191917"/>

<text class="big" x="40" y="46">A valid proof clears two independent axes</text>
<text class="ts" x="40" y="68">Clearing one is not clearing the other. Most designs clear neither, or only one.</text>

<!-- Axis 1: Availability -->
<rect x="40" y="96" width="600" height="132" rx="12" fill="none" stroke="#5DCAA5" stroke-width="1"/>
<text class="th" x="60" y="124" fill="#9FE1CB">Axis 1  Availability</text>
<text class="ts" x="60" y="144">Does verification block the business?</text>

<rect x="60" y="158" width="270" height="52" rx="8" fill="#633806" stroke="#EF9F27" stroke-width="0.5"/>
<text class="th" x="195" y="178" text-anchor="middle" dominant-baseline="central" fill="#FAC775">Blocking</text>
<text class="ts" x="195" y="196" text-anchor="middle" dominant-baseline="central" fill="#EF9F27">halts production until it catches up</text>

<rect x="350" y="158" width="270" height="52" rx="8" fill="#085041" stroke="#5DCAA5" stroke-width="0.5"/>
<text class="th" x="485" y="178" text-anchor="middle" dominant-baseline="central" fill="#9FE1CB">Non-blocking</text>
<text class="ts" x="485" y="196" text-anchor="middle" dominant-baseline="central" fill="#5DCAA5">runs alongside, never gates</text>

<!-- Axis 2: Trust -->
<rect x="40" y="248" width="600" height="132" rx="12" fill="none" stroke="#5DCAA5" stroke-width="1"/>
<text class="th" x="60" y="276" fill="#9FE1CB">Axis 2  Trust</text>
<text class="ts" x="60" y="296">Did the vendor determine its own verdict?</text>

<rect x="60" y="310" width="270" height="52" rx="8" fill="#633806" stroke="#EF9F27" stroke-width="0.5"/>
<text class="th" x="195" y="330" text-anchor="middle" dominant-baseline="central" fill="#FAC775">Self-attesting</text>
<text class="ts" x="195" y="348" text-anchor="middle" dominant-baseline="central" fill="#EF9F27">vendor grades its own homework</text>

<rect x="350" y="310" width="270" height="52" rx="8" fill="#085041" stroke="#5DCAA5" stroke-width="0.5"/>
<text class="th" x="485" y="330" text-anchor="middle" dominant-baseline="central" fill="#9FE1CB">Independent</text>
<text class="ts" x="485" y="348" text-anchor="middle" dominant-baseline="central" fill="#5DCAA5">an outside party seals the verdict</text>

<text class="ts" x="340" y="410" text-anchor="middle" fill="#c2c0b6">A proof must land on the right of BOTH axes. Non-blocking on production. Fail-closed on the verdict.</text>
</svg>
